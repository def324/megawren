name: checks
# Prose-only changes skip the build. Tag pushes always run, since GitHub
# does not apply path filters to tags. Packaging reads THIRD_PARTY_NOTICES.md
# and docs/licenses/, so those still trigger it.
on:
  push:
    paths-ignore:
      - README.md
      - docs/*.md
      - docs/media/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/*.md
      - docs/media/**
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          components: rustfmt, clippy
      # rust-cache keys on every installed toolchain, and runner images differ
      # in which extra ones they ship. Keep only the pinned toolchain.
      - run: |
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list --quiet | grep -v -x "$active" | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list
      # The runner image already has a newer CMake on PATH. Ubuntu's package
      # was most of this download, so it is installed only if missing.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcrypto++-dev libsodium-dev libsqlite3-dev libcurl4-openssl-dev libicu-dev libssl-dev patchelf
          command -v cmake || sudo apt-get install -y cmake
      - if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          brew install cmake pkgconf cryptopp libsodium icu4c
      # Both caches reuse results only when sources, flags and toolchain match.
      # The ccache key ends with "-sdk" because restores match by prefix, and
      # "macos-15" would otherwise also match the "macos-15-intel" cache.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.runner }}-sdk
          max-size: 1G
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
      # Embeds the dependency list in release binaries so they can be audited later.
      - run: cargo install --locked --version 0.7.7 cargo-auditable
      - run: ./scripts/build-sdk.sh
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
      - run: cargo fmt --check
      - run: ./scripts/cargo.sh test --locked
      - run: ./scripts/cargo.sh clippy --all-targets --locked -- -D warnings
      - run: ./scripts/cargo.sh auditable build --release --locked
      - run: python3 scripts/package.py
      - name: Run unpacked client
        run: |
          mkdir -p "$RUNNER_TEMP/megawren-package"
          tar -xzf target/dist/*.tar.gz -C "$RUNNER_TEMP/megawren-package"
          cd "$RUNNER_TEMP/megawren-package"/megawren-*
          bin/megawren --help
          bin/megawren status
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/test-install.sh scripts/build-linux-packages.sh scripts/scan-sboms.sh
      # install.sh installs the static archives on Linux, so it is tested there.
      - name: Test install.sh
        if: runner.os == 'macOS'
        run: sh scripts/test-install.sh target/dist/*.tar.gz
      # Release files come from main's run for the tagged commit. See docs/development.md.
      - name: Attest release files
        if: runner.os == 'macOS' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/dist/*.tar.gz
            target/dist/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megawren-${{ matrix.runner }}
          path: target/dist/
  # One statically linked binary per CPU runs on any Linux, including NAS systems.
  static-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUST_VERSION: 1.99.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      # Cache names put the runner before a fixed word, because restores match
      # by prefix and "ubuntu-24.04-" would also match "ubuntu-24.04-arm-".
      - name: Cache Crypto++ and curl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/static-deps/prefix
          key: static-${{ matrix.runner }}-deps-${{ hashFiles('scripts/build-static-linux.sh') }}
      - name: Cache SDK objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/static-cache/ccache
          key: static-${{ matrix.runner }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: static-${{ matrix.runner }}-ccache-
      - name: Cache Rust toolchain and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/static-cache/cargo
            target/static-cache/rustup
            target/release
            target/debug
          key: static-${{ matrix.runner }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: static-${{ matrix.runner }}-cargo-${{ env.RUST_VERSION }}-
      - name: Build in Alpine Linux
        run: >-
          docker run --rm --platform ${{ matrix.platform }} -e RUST_VERSION
          -v "$PWD:/work/megawren" -w /work/megawren alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf sh scripts/build-static-linux.sh
      - name: Run unpacked client on the host
        run: |
          mkdir -p "$RUNNER_TEMP/megawren-package"
          tar -xzf target/dist/*.tar.gz -C "$RUNNER_TEMP/megawren-package"
          cd "$RUNNER_TEMP/megawren-package"/megawren-*
          file bin/megawren
          cat RUNTIME.txt
          bin/megawren --help
          bin/megawren status
      - name: Test install.sh
        run: sh scripts/test-install.sh target/dist/*.tar.gz
      - name: Build .deb and .rpm
        run: sh scripts/build-linux-packages.sh target/dist/megawren-*-linux-musl.tar.gz
      - name: Install and remove the .deb
        run: |
          sudo apt-get install -y ./target/dist/megawren_*.deb
          megawren --version
          sudo apt-get remove -y megawren
          if dpkg -s megawren >/dev/null 2>&1 || [ -e /usr/bin/megawren ]; then exit 1; fi
      - name: Install and remove the .rpm on Fedora
        run: >-
          docker run --rm -v "$PWD/target/dist:/packages:ro" fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e sh -ec
          'dnf install -y /packages/megawren-*.rpm; megawren --version; megawren status;
          dnf remove -y megawren; if rpm -q megawren || [ -e /usr/bin/megawren ]; then exit 1; fi'
      - name: Attest release files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megawren-static-${{ matrix.runner }}
          path: target/dist/
  # Multi-arch image around the static binaries. Only version tags push it.
  container:
    needs: static-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: megawren-static-*
          path: target/static-artifacts
      - name: Unpack the static binaries
        run: |
          mkdir -p target/image
          for arch in amd64 arm64; do
            case $arch in amd64) cpu=x86_64 ;; arm64) cpu=aarch64 ;; esac
            root=target/image/$arch
            archive=$(ls target/static-artifacts/*/megawren-*-"$cpu"-unknown-linux-musl.tar.gz)
            tar -xzf "$archive" -C target/image
            unpacked=target/image/$(basename "$archive" .tar.gz)
            mkdir -p "$root/usr/bin" "$root/usr/share/doc/megawren" "$root/data" "$root/tmp"
            chmod 1777 "$root/tmp"
            mv "$unpacked/bin/megawren" "$root/usr/bin/"
            mv "$unpacked/LICENSE" "$unpacked/THIRD_PARTY_NOTICES.md" "$unpacked/licenses" "$root/usr/share/doc/megawren/"
            rm -rf "$unpacked"
          done
      - name: Build and test the image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 --load -t megawren:test -f packaging/Dockerfile target/image
          docker run --rm megawren:test --version
          docker run --rm -v megawren-test:/data megawren:test status
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/Dockerfile target/image
      - name: Push to ghcr.io
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/image.json" \
            -t "ghcr.io/def324/megawren:${GITHUB_REF_NAME#v}" -t ghcr.io/def324/megawren:latest \
            -f packaging/Dockerfile target/image
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")" >>"$GITHUB_OUTPUT"
      - name: Attest the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/def324/megawren
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  # Checks each archive's SBOM, bundled C libraries included, against known
  # vulnerabilities that already have a fix. security.yml repeats this weekly
  # for the latest release.
  sbom-scan:
    needs: [build, static-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: megawren-*
          path: sboms
          merge-multiple: true
      - name: Scan with Grype
        run: sh scripts/scan-sboms.sh sboms

name: security
# Looks for newly disclosed vulnerabilities every Monday, even without new
# commits. A failed scheduled run emails the maintainer who set the schedule.
on:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/security.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RustSec advisories, licenses, and crate sources. See deny.toml.
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories bans licenses sources
  # Rescans what people downloaded: the SBOMs attached to the latest release.
  release-sbom:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the latest release's SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sboms
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.cdx.json' --dir sboms || true
          ls -l sboms
      - name: Scan with Grype
        run: |
          if ! ls sboms/*.cdx.json >/dev/null 2>&1; then
            echo "::notice::The latest release has no SBOMs yet. Scanning only the canary."
          fi
          sh scripts/scan-sboms.sh sboms

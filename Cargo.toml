[package]
name = "megawren"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
cxx = "1"
dirs = "6"
getrandom = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
ratatui-image = { version = "11.1", default-features = false }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

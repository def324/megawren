# cargo-deny policy, checked in CI by .github/workflows/security.yml.

[advisories]
version = 2
# Fail on known vulnerabilities, unsound code, and yanked releases. Unmaintained
# notices fail only for direct dependencies, which Megawren can replace.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. GPL and LGPL appear in this tree only as one choice
# among permissive alternatives, which cargo-deny accepts.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

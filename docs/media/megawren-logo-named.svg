    <path d="M19 8h3v1h-3zM18 9h1v1h-1zM21 9h1v1h-1zM18 10h1v1h-1zM21 10h1v1h-1zM19 11h3v1h-3zM21 12h1v1h-1zM18 13h3v1h-3z"/>
    <path d="M24 8h2v1h-2zM26 9h1v1h-1zM24 10h3v1h-3zM23 11h1v1h-1zM26 11h1v1h-1zM24 12h3v1h-3z"/>
    <path d="M28 8h1v1h-1zM32 8h1v1h-1zM28 9h1v1h-1zM32 9h1v1h-1zM28 10h1v1h-1zM30 10h1v1h-1zM32 10h1v1h-1zM28 11h1v1h-1zM30 11h1v1h-1zM32 11h1v1h-1zM29 12h1v1h-1zM31 12h1v1h-1z"/>
    <path d="M34 8h1v1h-1zM36 8h2v1h-2zM34 9h2v1h-2zM34 10h1v1h-1zM34 11h1v1h-1zM34 12h1v1h-1z"/>
    <path d="M40 8h2v1h-2zM39 9h1v1h-1zM42 9h1v1h-1zM39 10h4v1h-4zM39 11h1v1h-1zM40 12h3v1h-3z"/>
    <path d="M44 8h3v1h-3zM44 9h1v1h-1zM47 9h1v1h-1zM44 10h1v1h-1zM47 10h1v1h-1zM44 11h1v1h-1zM47 11h1v1h-1zM44 12h1v1h-1zM47 12h1v1h-1z"/>

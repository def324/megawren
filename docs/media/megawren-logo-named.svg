  <path fill="#58a6ff" d="m8 25 3-3 11 10-11 10-3-3 8-7zM26 38h20v4H26z"/>

  <!-- Draw the bird on a coarse grid, like a custom terminal glyph. -->
  <path fill="#e6edf3" d="
    M25 22h3v3h3v3h3v-3h2v-3h6v2h2v2h4v2h-4v4h-2v2h-3v4h-2v-3h-5v-2h-3v-3h-2v-4h-2z"/>
  <path fill="#0d1117" d="M40 24h2v2h-2z"/>

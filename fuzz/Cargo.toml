# Fuzz targets for code that handles untrusted input. See docs/development.md.
# The targets compile src/text.rs and src/vault.rs directly, so they build
# without the MEGA SDK. Run with: cargo +nightly fuzz run <target>
[package]
name = "megawren-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
anyhow = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
serde = "1"
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

# Kept out of the main crate's workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "display"
path = "fuzz_targets/display.rs"
test = false
doc = false
bench = false

[[bin]]
name = "listing_json"
path = "fuzz_targets/listing_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_open"
path = "fuzz_targets/vault_open.rs"
test = false
doc = false
bench = false
